{% extends 'base.html' %}
{% block content %}

<div class="d-sm-flex align-items-center justify-content-between mb-4">
    <div>
        <h1 class="h3 mb-0 text-gray-800">Dashboard</h1>
        <p class="text-muted">Welcome back to your business overview.</p>
    </div>
    <img src="{{ url_for('static', filename='Logo.png') }}" alt="Zentory" style="height: 40px;">
</div>

<div class="row mb-4 g-3">
    <div class="col-md-3">
        <div class="card bg-primary text-white h-100 border-start border-5 border-dark-subtle">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="small text-white-50 fw-bold text-uppercase">Stock Value</div>
                    <h3 class="fw-bold mb-0">${{ stock_value }}</h3>
                </div>
                <i class="fas fa-box-open fa-2x text-white-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-success text-white h-100 border-start border-5 border-dark-subtle">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="small text-white-50 fw-bold text-uppercase">Total Sales</div>
                    <h3 class="fw-bold mb-0">{{ total_sales }}</h3>
                </div>
                <i class="fas fa-receipt fa-2x text-white-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-info text-white h-100 border-start border-5 border-dark-subtle">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="small text-white-50 fw-bold text-uppercase">Customers</div>
                    <h3 class="fw-bold mb-0">{{ customers }}</h3>
                </div>
                <i class="fas fa-user-tag fa-2x text-white-50"></i>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-warning text-dark h-100 border-start border-5 border-dark-subtle">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <div class="small text-black-50 fw-bold text-uppercase">Balance</div>
                    <h3 class="fw-bold mb-0">${{ balance }}</h3>
                </div>
                <i class="fas fa-wallet fa-2x text-black-50"></i>
            </div>
        </div>
    </div>
</div>

<div class="row g-4">
    <div class="col-md-7">
        <div class="card h-100">
            <div class="card-header bg-white fw-bold"><i class="fas fa-chart-area me-2"></i>Sales Trend</div>
            <div class="card-body"><canvas id="salesChart" height="250"></canvas></div>
        </div>
    </div>
    <div class="col-md-5">
        <div class="card h-100">
            <div class="card-header bg-white fw-bold"><i class="fas fa-chart-pie me-2"></i>Income vs Expenses</div>
            <div class="card-body d-flex align-items-center">
                <canvas id="incomeExpenseChart"></canvas>
            </div>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header bg-white fw-bold">Stock Distribution</div>
            <div class="card-body"><canvas id="stockChart" height="100"></canvas></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
</script>
{% endblock %}
