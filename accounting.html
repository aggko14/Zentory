{% extends 'base.html' %}
{% block content %}
<h1>Accounting</h1>
<h4>Current Balance: <strong>${{ balance }}</strong></h4>

<form method="POST" class="mb-4">
    <div class="row g-3">
        <div class="col-md-5"><input type="text" name="description" class="form-control" placeholder="Description" required></div>
        <div class="col-md-3"><input type="number" step="0.01" name="amount" class="form-control" placeholder="Amount" required></div>
        <div class="col-md-2">
            <select name="type" class="form-select">
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Add Transaction</button></div>
    </div>
</form>

<table class="table table-striped">
    <thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Type</th><th>Action</th></tr></thead>
    <tbody>
        {% for t in transactions %}
        <tr>
            <td>{{ t.date.strftime('%Y-%m-%d %H:%M') }}</td>
            <td>{{ t.description }}</td>
            <td>${{ t.amount }}</td>
            <td><span class="badge bg-{{ 'success' if t.type=='income' else 'danger' }}">{{ t.type }}</span></td>
            <td>
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="delete_id" value="{{ t.id }}">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
