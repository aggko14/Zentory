{% extends 'base.html' %}
{% block content %}
<div class="mb-4">
    <h1><i class="fas fa-users text-info me-2"></i>CRM - Customers</h1>
    <p class="text-muted">Manage your client relationships and contact details.</p>
</div>

<div class="card mb-4 border-0 shadow-sm">
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-4">
                    <div class="input-group">
                        <span class="input-group-text border-0 bg-light"><i class="fas fa-user text-muted"></i></span>
                        <input type="text" name="name" class="form-control border-0 bg-light" placeholder="Full Name" required>
                    </div>
                </div>
                <div class="col-md-3">
                    <input type="email" name="email" class="form-control border-0 bg-light" placeholder="Email Address">
                </div>
                <div class="col-md-3">
                    <input type="text" name="phone" class="form-control border-0 bg-light" placeholder="Phone Number">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-info text-white w-100 fw-bold">Add Client</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="card border-0 shadow-sm">
    <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
                <tr>
                    <th class="ps-3">Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th class="text-center">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for c in customers %}
                <tr>
                    <td class="ps-3">
                        <div class="d-flex align-items-center">
                            <div class="rounded-circle bg-info-subtle text-info d-flex align-items-center justify-content-center me-3" style="width: 35px; height: 35px; font-weight: bold;">
                                {{ c.name[0] | upper }}
                            </div>
                            <span class="fw-bold">{{ c.name }}</span>
                        </div>
                    </td>
                    <td class="text-muted small">{{ c.email }}</td>
                    <td class="text-muted small">{{ c.phone }}</td>
                    <td class="text-center">
                        <form method="POST" style="display:inline;">
                            <input type="hidden" name="delete_id" value="{{ c.id }}">
                            <button type="submit" class="btn btn-outline-danger btn-sm rounded-pill px-3" onclick="return confirm('Delete customer?')">
                                Remove
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
