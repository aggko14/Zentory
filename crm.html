{% extends 'base.html' %}
{% block content %}
<h1>CRM - Customers</h1>

<form method="POST" class="mb-4">
    <div class="row g-3">
        <div class="col-md-4"><input type="text" name="name" class="form-control" placeholder="Customer Name" required></div>
        <div class="col-md-3"><input type="email" name="email" class="form-control" placeholder="Email"></div>
        <div class="col-md-3"><input type="text" name="phone" class="form-control" placeholder="Phone"></div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100">Add Customer</button></div>
    </div>
</form>

<table class="table table-striped">
    <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Action</th></tr></thead>
    <tbody>
        {% for c in customers %}
        <tr>
            <td>{{ c.name }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.phone }}</td>
            <td>
                <form method="POST" style="display:inline;">
                    <input type="hidden" name="delete_id" value="{{ c.id }}">
                    <button type="submit" class="btn btn-danger btn-sm" onclick="return confirm('Delete customer?')">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
