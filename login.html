{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-4">
        <div class="card shadow-lg">
            <div class="card-header text-center bg-white border-0 pt-4">
                <div class="display-4 text-primary mb-2"><i class="fas fa-shield-halved"></i></div>
                <h3 class="fw-bold">Zentory Login</h3>
                <p class="text-muted small">Manage your business with ease</p>
            </div>
            <div class="card-body px-4 pb-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                            <input type="text" name="username" class="form-control bg-light border-start-0" value="admin" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                            <input type="password" name="password" class="form-control bg-light border-start-0" value="1234" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Sign In</button>
                </form>
                <div class="mt-4 p-2 bg-light rounded text-center">
                    <p class="mb-0 text-muted small">Demo: <strong>admin</strong> / <strong>1234</strong></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
